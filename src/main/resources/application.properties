spring.application.name=saude

# Libera o CORS para o seu Frontend (Vue/React) na Vercel e Localhost
spring.web.cors.allowed-origins=http://localhost:5173,https://*.vercel.app

# Desativa o aviso chato do Open-In-View no log
spring.jpa.open-in-view=false

# ==========================================
# CONFIGURAÇÃO DO BANCO GRATUITO H2 (EM MEMÓRIA)
# ==========================================
spring.datasource.url=jdbc:h2:mem:saudedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Cria as tabelas automaticamente na nuvem
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true